# input.conf — rice keybinds

# ===== NAVIGATION =====
LEFT        seek -5
RIGHT       seek +5
UP          seek 30
DOWN        seek -30
SHIFT+LEFT  seek -30
SHIFT+RIGHT seek +30
SHIFT+UP    seek 120
SHIFT+DOWN  seek -120

# Frame step
.           frame-step
,           frame-back-step

# ===== VOLUME =====
0           mute
9           volume -5
/           volume +5
m           cycle mute
v           cycle sub visibility

# ===== PLAYBACK =====
SPACE       cycle pause
p           cycle pause
n           playlist-next
SHIFT+N     playlist-prev
ALT+LEFT    playlist-prev
ALT+RIGHT   playlist-next

# Speed
[           speed 0.9
]           speed 1.1
{           speed 0.5
}           speed 2.0
BACKSPACE   set speed 1.0

# ===== VIDEO =====
f           cycle fullscreen
F           toggle-border
w           cycle panscan
W          osci          # waveform
e           screenshot
E           screenshot video
SHIFT+E     schedule-quit

# ===== SUBTITLES =====
j           cycle sub
J           cycle sub down
x           sub-seek -1
z           sub-seek +1
r           sub-reload
Z           add sub-delay -0.1
X           add sub-delay +0.1

# ===== BOOKMARKS =====
b           bookmark-toggle
SHIFT+B     bookmark-prev
ALT+B       bookmark-next

# ===== PLAYLIST =====
TAB         show-playlist
SHIFT+TAB   hide-playlist

# ===== SCREENSHOT =====
s           screenshot
S           screenshot-to-file "~~desktop/Screenshots/%F-%P.png"

# ===== CONTROLS =====
o           show-progress
I           show-file-info
SHIFT+I     show-track-info
q           quit
Q           quit-watch-later

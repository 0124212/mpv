# mpv.conf — rice config

# ===== VIDEO =====
profile=gpu-hq
vo=gpu-next
hwdec=auto
gpu-api=vulkan
gpu-context=auto
vd-lavc-dr=auto
vd-lavc-fast=yes

# Scaling
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=5

# Interpolation
interpolation=yes
tscale=oversample

# ===== AUDIO =====
ao=wasapi
audio-channels=auto
volume=80
volume-max=100
audio-pitch-correction=yes
audio-file-auto=fuzzy

# ===== SUBTITLES =====
sub-auto=fuzzy
sub-font="JetBrainsMono NF"
sub-font-size=36
sub-border-size=2
sub-shadow-offset=1
sub-shadow-color="#33000000"
sub-pos=100
sub-use-margins=yes

# OSD
osd-font="JetBrainsMono NF"
osd-font-size=24
osd-color="#F8F8F2"
osd-border-color="#282A36"
osd-border-size=2
osd-bar-h=2
osd-bar-w=80

# ===== INTERFACE =====
cursor-autohide=1000
osd-duration=3000
osd-on-seek=message
keep-open=yes
keep-open-pause=no
save-position-on-quit=yes
resume-playback=yes

# Screenshot
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-png-compression=3
screenshot-directory="~~desktop/Screenshots"
screenshot-template="%F-%P"

# ===== PERFORMANCE =====
cache=yes
demuxer-max-bytes=500MiB
demuxer-max-back-bytes=250MiB
decoder-lavc-o=honor_trixbox_sidx:noDROPframe
